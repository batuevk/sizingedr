<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сайзинг Platform EDR 8.3</title>
<style>
:root,html[data-theme="light"]{
  --paper:#fbfcfc;--panel:#f1f4f5;--ink:#1a2127;--muted:#66717c;--rule:#d9dfe3;
  --accent:#00876f;--accent-soft:#e2f2ee;--warn:#a85b00;--warn-soft:#fbf0e1;--bad:#b3261e;
  color-scheme:light;
}
html[data-theme="dark"]{
  --paper:#14191d;--panel:#1b2227;--ink:#e3e8eb;--muted:#93a0aa;--rule:#2c363d;
  --accent:#3cc2a5;--accent-soft:#16302b;--warn:#e7a54b;--warn-soft:#33281a;--bad:#f2867e;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 'Segoe UI',system-ui,-apple-system,Roboto,sans-serif}
header{padding:16px 24px;border-bottom:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;background:var(--panel);position:sticky;top:0;z-index:50}
.header-left{display:flex;align-items:center;gap:14px;min-width:0}
.logo{width:40px;height:40px;flex-shrink:0;background:linear-gradient(135deg,var(--accent),#00a884);border-radius:10px;display:flex;align-items:center;justify-content:center}
.logo svg{width:24px;height:24px;fill:white}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em;color:var(--ink);font-family:inherit}
.meta{color:var(--muted);font-size:12px;margin-top:2px;font-family:inherit}
.theme-toggle{background:var(--paper);border:1px solid var(--rule);border-radius:20px;padding:6px 12px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);font-weight:500;font-family:inherit}
.theme-toggle:hover{border-color:var(--accent);color:var(--accent)}
.theme-toggle svg{width:16px;height:16px;fill:currentColor}
.layout{display:grid;grid-template-columns:minmax(300px,380px) 1fr;min-height:calc(100vh - 73px)}
aside{background:var(--panel);border-right:1px solid var(--rule);padding:8px 20px 28px;overflow-y:auto;max-height:calc(100vh - 73px);position:sticky;top:73px}
aside::-webkit-scrollbar{width:6px}
aside::-webkit-scrollbar-thumb{background:var(--rule);border-radius:3px}
main{padding:20px 28px 40px;min-width:0}
fieldset{border:0;border-top:1px solid var(--rule);margin:0;padding:16px 0 12px}
fieldset:first-child{border-top:0;padding-top:8px}
legend{font-weight:700;font-size:12px;padding:0;margin-bottom:10px;color:var(--accent);text-transform:uppercase;letter-spacing:.8px;display:flex;align-items:center;gap:8px;font-family:inherit}
legend::before{content:"";width:3px;height:14px;background:var(--accent);border-radius:2px}
.row{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center;margin:8px 0;padding:4px 6px;border-radius:6px}
.row:hover{background:var(--accent-soft)}
.row label{color:var(--ink);font-size:13px;font-weight:500;font-family:inherit}
.row .hint{display:block;color:var(--muted);font-size:11px;margin-top:2px;font-weight:400;font-family:inherit}
.sub{font-size:12px;color:var(--muted);margin:12px 0 4px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;font-family:inherit}
select,input[type=number]{width:100%;font:inherit;padding:7px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);font-family:inherit}
select:focus,input[type=number]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
input[type=number]{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);justify-self:end;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.limit{font-size:12px;color:var(--muted);margin-top:6px;padding:8px 12px;background:var(--accent-soft);border-radius:6px;border-left:3px solid var(--accent);font-family:inherit}
.limit.over{color:var(--bad);background:var(--warn-soft);border-left-color:var(--warn);font-weight:600}
.load{display:flex;flex-wrap:wrap;gap:24px;margin-bottom:20px;padding:18px;background:var(--accent-soft);border-radius:10px;border:1px solid var(--accent)}
.load div{display:flex;flex-direction:column;min-width:120px}
.load b{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent);font-family:inherit}
.load span{color:var(--muted);font-size:12px;font-weight:500;font-family:inherit}
.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:8px;margin:16px 0}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-family:inherit}
th,td{padding:10px 12px;text-align:center;vertical-align:middle;border-bottom:1px solid var(--rule);font-family:inherit}
th{font-weight:600;font-size:12px;background:var(--accent);color:#fff;text-transform:uppercase;letter-spacing:.5px}
td.n{font-weight:600;white-space:nowrap}
td.disk{white-space:pre-line;min-width:170px}
td.cm{white-space:pre-line;color:var(--muted);font-size:12px;font-style:italic}
td.cnt{font-weight:700;white-space:nowrap;color:var(--accent);font-size:14px}
tr:hover:not(.total){background:var(--accent-soft)}
tr.total td{font-weight:700;border-bottom:0;background:var(--accent);color:#fff;font-size:14px}
.kind{color:var(--muted);font-size:11px;font-style:italic;margin-top:2px;font-family:inherit}
.quality{margin:16px 0 0;padding:12px 16px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;font-weight:600;font-size:13px;font-family:inherit}
.quality.warn{border-color:var(--warn);background:var(--warn-soft)}
details{margin-top:24px;border-top:1px solid var(--rule);padding-top:14px}
summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--accent);padding:6px 0;font-family:inherit}
summary:hover{text-decoration:underline}
details ul{padding-left:22px;margin:10px 0 0}
details li{margin:6px 0;white-space:pre-wrap;line-height:1.5;font-size:13px;font-family:inherit}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px;padding:14px;background:var(--panel);border-radius:10px;align-items:center}
button.act{font:inherit;padding:8px 14px;border:1px solid var(--accent);border-radius:6px;background:var(--paper);color:var(--accent);cursor:pointer;font-weight:600;font-size:13px;font-family:inherit;transition:all .3s ease}
button.act:hover{background:var(--accent);color:#fff}
button.act.copied{background:var(--accent);color:#fff;border-color:var(--accent);animation:pulse .4s ease}
button.act.reset{border-color:var(--warn);color:var(--warn)}
button.act.reset:hover{background:var(--warn);color:#fff}
@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.05);box-shadow:0 0 0 6px var(--accent-soft)}
  100%{transform:scale(1)}
}
#toast{color:var(--accent);font-size:13px;font-weight:600;margin-left:auto;font-family:inherit;padding:6px 12px;border-radius:6px;background:var(--accent-soft);opacity:0;transition:opacity .3s}
#toast.show{opacity:1}
#toast.warn{color:var(--warn);background:var(--warn-soft)}
.err{color:var(--bad);white-space:pre-wrap;padding:14px;background:var(--warn-soft);border-radius:8px;border-left:4px solid var(--bad);font-weight:600;font-family:inherit}
.disclaimer{margin-bottom:24px;padding:16px;background:var(--warn-soft);border:1px solid var(--warn);border-radius:8px;font-size:13px;color:var(--ink);line-height:1.6;font-family:inherit}
.disclaimer-title{font-weight:700;color:var(--warn);margin-bottom:8px;display:flex;align-items:center;gap:8px;font-size:14px;font-family:inherit}
.disclaimer p{margin:8px 0}
.disclaimer ul{margin:8px 0 0 20px;padding:0}
.disclaimer ul li{margin:4px 0}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  aside{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--rule)}
  main{padding:16px}
  header{padding:12px 16px}
  h1{font-size:16px}
  .row{grid-template-columns:1fr 120px;gap:8px}
  .load{gap:16px;padding:14px}
  .load b{font-size:20px}
  td.disk{min-width:140px}
}
@media (max-width:480px){
  .row{grid-template-columns:1fr;gap:4px}
  .row input[type=checkbox]{justify-self:start}
  .load{flex-direction:column;gap:12px}
  .load div{flex-direction:row;justify-content:space-between;align-items:center}
}
</style>
</head>

    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 2L4 6v6c0 5 3.5 9.5 8 10 4.5-.5 8-5 8-10V6l-8-4z"/></svg>

    <div>
      <h1>Сайзинг Platform EDR 8.3</h1>

    </div>
  </div>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Переключить тему">
    <svg id="themeIcon" viewBox="0 0 24 24"></svg>
    <span id="themeLabel">Тёмная</span>
  </button>
</header>
<div class="layout">
  <aside id="form"></aside>
  <main id="out"></main>
</div>
